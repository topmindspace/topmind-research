name: sources-weekly

# 每周巡检 sources.yaml 的可达性，只报告不阻断；结果在 Actions 日志里，需人工判断后再改配置。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sources
        run: python3 scripts/check_sources.py || true
