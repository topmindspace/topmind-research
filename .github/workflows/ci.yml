name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install skills-ref
        run: pip install skills-ref
      - name: Run checks
        run: bash scripts/ci_checks.sh
