name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # npm 包内容检查（scripts/check_npm_pack.py）需要 npm
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install skills-ref
        run: pip install skills-ref==0.1.1
      - name: Run checks
        run: bash scripts/ci_checks.sh
