# 信息源配置 · 改这里，不用改技能
#
# 字段说明
#   blog / news / reports / url：人看的列表页或主页
#   rss：可直接解析的 RSS/Atom 地址，collect 优先用它（scripts/collect_feeds.py）
#   fetch：http = 普通请求可取；browser = 普通请求被拦（403/超时），需浏览器或 WebFetch
#   status：ok = 已核验可用；tbd = 待核（地址打不开、不是官方新闻页或无法确认），collect 可读但须在周报「信源状态」里列出
#   verified_at：最近一次人工或脚本核验日期
#   note：核验备注
#
# 维护规则
#   - 新增、下线、改地址只改本文件；技能运行时只提出候选，由用户确认后再改（见 references/upgrade-rules.md）
#   - 核验命令：python3 scripts/check_sources.py（仓库根目录执行，只报告不改文件）
#   - 社区信号（Hacker News、Reddit、X 讨论、YouTube 等）不在本文件维护，交给 last30days
#
# 最后更新：2026-10-08

