# 信息源配置 · 改这里，不用改技能
#
# 字段说明
#   人看的页面
#     blog / news / reports / url：列表页或主页；sitemap：站点地图；podcast：播客列表；trending：热门榜
#   可机读渠道（collect 优先用，scripts/collect_feeds.py 会解析前五种）
#     rss / rss_extra：RSS 或 Atom（rss_extra 为补充渠道，覆盖范围见 note）
#     hf_api：Hugging Face 组织模型列表 JSON，按创建时间倒序，作为 T0 发布信号
#     gh_api：GitHub 组织仓库（按创建时间）或 releases 列表 JSON，作为 T0 发布信号；未登录每小时 60 次
#     papers_api：Hugging Face 每日论文 JSON，脚本按窗口逐日取，作为论文的筛选信号
#     list_api：站点自己的列表接口，脚本不解析，agent 按 note 调用；list_api_method / list_api_body 写请求方法和表单
#   fetch（怎么读人看的页面）
#     http = 普通请求能拿到带日期的列表；browser = 普通请求被拦（403/超时），需浏览器或 WebFetch；
#     js = 页面能打开，但列表靠前端渲染，静态请求拿不到条目；api = 列表要走 list_api；
#     x = 页面拿不到，用 x_account 的官方帖子确认发布
#   status（这个信源 collect 能不能用）
#     ok = 至少有一个已核验的渠道能拿到带日期的条目（可机读渠道，或 fetch: http 的列表页）
#     page-only = 可打开但不可机读：页面能打开，列表靠前端渲染，又没有可机读渠道，只能浏览器或人工看
#     blocked = 普通请求被拦（如 Cloudflare 人机验证），没有可机读渠道或只有覆盖不全的补充渠道
#     tbd = 待核（地址打不开、不是官方新闻页或无法确认）
#     ok 以外的状态都要在 note 写原因；collect 周报的「信源状态」要列出 ok 以外的信源和「抓到 0 条 / 没抓到」
#   headers：请求头档位，default（脚本 UA）/ browser（全套浏览器头）/ none（不主动带 UA）
#   ca_root：该站证书链用到的、部分系统 CA 库还没有的根证书地址；抓取报 SSL 错误时下载它，用 collect_feeds.py --ca-bundle 追加。
#     ca_bundle（本机 PEM 路径）只写在自己安装目录的副本里，不提交进仓库。任何情况下都不跳过证书校验
#   x_account：公司官方 X 账号（不带 @），供 last30days 或人工查看
#   verified_at：最近一次人工或脚本核验日期
#   note：核验备注
#
# 维护规则
#   - 新增、下线、改地址只改本文件；技能运行时只提出候选，由用户确认后再改（见 references/upgrade-rules.md）
#   - 核验命令：在 topmind-research 仓库根目录运行 python3 scripts/check_sources.py（只报告不改文件；技能安装目录里没有这个脚本）
#   - 社区信号（Hacker News、Reddit、X 讨论、YouTube 等）不在本文件维护，交给 last30days
#   - 可机读渠道只写实际请求过、返回了数据的地址，note 里写最新一条的日期
#
# 最后更新：2026-10-08

